<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__RUNVIZ_TITLE__</title>
<style>
:root {
  color-scheme: light;
  --page: #f3f3f0;
  --surface: #fcfcfb;
  --surface-2: #f0efec;
  --canvas: #f0f0f0;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --hair: #e1e0d9;
  --border: rgba(11,11,11,0.10);
  --accent: #2a78d6;
  --accent-soft: rgba(42,120,214,0.14);
  --good: #0ca30c;
  --warning: #fab219;
  --warning-ink: #b57a00;
  --serious: #ec835a;
  --critical: #d03b3b;
  --aborted: #6b7c93;
  --unknown: #898781;
  --node-edge: var(--accent);   /* edge and glow of the selected node; white on the dark canvas, as in FFAStransX */
  --mono: ui-monospace, "Cascadia Mono", Consolas, "Segoe UI Mono", Menlo, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #242423; --canvas: #202020;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781; --hair: #2c2c2a; --border: rgba(255,255,255,0.10);
    --accent: #3987e5; --accent-soft: rgba(57,135,229,0.22); --warning-ink: #fab219; --aborted: #8a9bb3; --node-edge: #ffffff;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #242423; --canvas: #202020;
  --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781; --hair: #2c2c2a; --border: rgba(255,255,255,0.10);
  --accent: #3987e5; --accent-soft: rgba(57,135,229,0.22); --warning-ink: #fab219; --aborted: #8a9bb3; --node-edge: #ffffff;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 13px/1.4 var(--sans); }
button, input, select { font: inherit; color: inherit; }
button { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 3px 9px; cursor: pointer; }
button:hover { background: var(--surface-2); }
button.on { background: var(--accent-soft); border-color: var(--accent); }
code, pre, .mono { font-family: var(--mono); }
a { color: var(--accent); }

#app { height: 100vh; display: grid; grid-template-rows: auto minmax(0,1fr) auto; gap: 8px; padding: 8px 12px; }
#hdr { display: flex; align-items: flex-start; gap: 8px 16px; min-width: 0; }
#logo { flex: none; display: block; width: 40px; height: 40px; }
#jobInfo { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; overflow-wrap: anywhere; }
#hdr h1 { font-size: 17px; margin: 0; font-weight: 600; }
#hdr .sub { color: var(--ink-2); }
#hdr .src { color: var(--ink-2); font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--border); background: var(--surface); }
.chip.ok { border-color: var(--good); color: var(--good); }
.chip.error { border-color: var(--critical); color: var(--critical); }
.chip.warn { border-color: var(--serious); color: var(--serious); }
.chip.cond { border-color: var(--warning-ink); color: var(--warning-ink); }
.chip.aborted { border-color: var(--aborted); color: var(--aborted); }
#helpBtn { margin-left: auto; }
#help { position: relative; }
#helpBox { display: none; position: absolute; right: 0; top: 30px; z-index: 20; width: min(520px, 90vw); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; box-shadow: 0 8px 24px rgba(0,0,0,.2); font-size: 12px; }
#helpBox.open { display: block; }
#helpBox dt { font-weight: 600; margin-top: 6px; }
#helpBox dd { margin: 0 0 2px; color: var(--ink-2); }

#stats { flex: 0 0 62%; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; }
.tile { flex: 1 0 82px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; }
.tile .v { font-size: 17px; font-weight: 600; line-height: 1.2; white-space: nowrap; }
.tile .l { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.tile .s { font-size: 11px; color: var(--ink-2); }
.tile.bad .v { color: var(--critical); }
.tile.cond .v { color: var(--warning-ink); }
.tile.warn .v { color: var(--serious); }
.tile.aborted .v { color: var(--aborted); }

#workspace { display: grid; grid-template-columns: minmax(0,1fr); grid-template-rows: minmax(0,1fr) 10px var(--timeline-height, 260px); min-height: 0; min-width: 0; }
#workspace.tl-collapsed { grid-template-rows: minmax(0,1fr) 0px auto; row-gap: 4px; }
#main { display: grid; grid-template-columns: minmax(0,1fr) 10px var(--panel-width, 470px); min-height: 0; min-width: 0; }
.splitter { position: relative; touch-action: none; user-select: none; border-radius: 4px; cursor: col-resize; }
.splitter::after { content: ''; position: absolute; background: var(--hair); border-radius: 2px; width: 3px; height: 32px; left: calc(50% - 1.5px); top: calc(50% - 16px); }
.splitter.horizontal { cursor: row-resize; }
.splitter.horizontal::after { width: 32px; height: 3px; left: calc(50% - 16px); top: calc(50% - 1.5px); }
.splitter:hover, .splitter:focus-visible, .splitter.dragging { background: var(--accent-soft); outline: none; }
.splitter:hover::after, .splitter:focus-visible::after, .splitter.dragging::after { background: var(--accent); }
#workspace.tl-collapsed #timelineSplitter { visibility: hidden; }
body.resizing, body.resizing * { cursor: var(--resize-cursor) !important; user-select: none !important; }
#canvasWrap { position: relative; background: var(--canvas); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; min-height: 0; min-width: 0; display: flex; flex-direction: column; }
#canvasBar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 8px; border-bottom: 1px solid var(--hair); background: var(--surface); }
#wfTabs { display: flex; gap: 4px; flex-wrap: wrap; }
#wfTabs button.on { font-weight: 600; }
#canvasBar .spacer { flex: 1; }
#canvasBar .zoom { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
#canvas { flex: 1; width: 100%; height: 100%; min-height: 0; display: block; cursor: grab; touch-action: none; user-select: none; }
#canvas.panning { cursor: grabbing; }
#canvas.far .desc { display: none; }
#tooltip { position: fixed; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.18); max-width: 340px; display: none; z-index: 50; }
#tooltip b { display: block; }
#tooltip .m { color: var(--ink-2); }

#panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: auto; min-height: 0; min-width: 0; padding: 10px 12px; }
#logHeading { scroll-margin-top: 10px; }
#logHeading:focus { outline: none; color: var(--ink); }
#panel h2 { font-size: 15px; margin: 0 0 6px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
#panel h3 { font-size: 12px; margin: 14px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
#panel .back { margin-bottom: 8px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; font-size: 12px; }
.kv .k { color: var(--muted); }
.kv .v { overflow-wrap: anywhere; }
.swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--border); vertical-align: -1px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: 0; }
.st-ok { color: var(--good); } .st-error { color: var(--critical); } .st-cond_false { color: var(--warning-ink); } .st-warn { color: var(--serious); } .st-aborted { color: var(--aborted); } .st-unknown, .st-idle { color: var(--muted); }
.bg-ok { background: var(--good); } .bg-error { background: var(--critical); } .bg-cond_false { background: var(--warning); } .bg-warn { background: var(--serious); } .bg-aborted { background: var(--aborted); } .bg-unknown, .bg-idle { background: var(--unknown); }

.issue, .runcard, .splitrow { border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; margin: 4px 0; background: var(--surface-2); cursor: pointer; }
.issue:hover, .runcard:hover, .splitrow:hover { border-color: var(--accent); }
.issue .m, .runcard .m, .splitrow .m { color: var(--ink-2); font-size: 12px; }
.issue .msg { margin: 4px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; font-family: var(--mono); max-height: 96px; overflow: auto; }
.issue .src { color: var(--muted); font-size: 11px; }
.issue .evs { margin: 4px 0 0; padding: 0; list-style: none; font-size: 11px; }
.issue .evs li { display: flex; gap: 6px; align-items: baseline; }
.issue .evs .t { font-family: var(--mono); color: var(--muted); min-width: 62px; }
.issue .evs .line { color: var(--ink-2); overflow-wrap: anywhere; }
.issue.sev-error { border-left: 3px solid var(--critical); }
.issue.sev-aborted { border-left: 3px solid var(--aborted); }
.issue.sev-cond_false { border-left: 3px solid var(--warning); }
.issue.sev-warn { border-left: 3px solid var(--serious); }
.grp-title { margin: 10px 0 2px; color: var(--ink-2); font-weight: 600; font-size: 12px; }
.explain { font-size: 12px; color: var(--ink-2); background: var(--surface); border: 1px dashed var(--border); border-radius: 6px; padding: 4px 8px; margin: 4px 0; }
.runcard.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.splitrow.sel { border-color: var(--accent); }
.tree { margin: 0; padding-left: 14px; list-style: none; }
.tree > li { margin: 2px 0; }
.chain { color: var(--ink-2); font-size: 11px; }
.chain .cur { color: var(--ink); }
.link { color: var(--accent); cursor: pointer; text-decoration: underline dotted; }

#evtools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 6px 0; position: sticky; top: -10px; background: var(--surface); padding: 6px 0; z-index: 2; }
#evtools input[type=search] { flex: 1; min-width: 120px; padding: 3px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-2); }
.ev { border-top: 1px solid var(--hair); padding: 3px 4px; cursor: pointer; }
.ev:hover { background: var(--surface-2); }
.ev .row { display: grid; grid-template-columns: 62px 84px 58px 62px 1fr; gap: 6px; align-items: baseline; font-size: 12px; }
.ev .t { font-family: var(--mono); color: var(--muted); }
.ev .c { font-family: var(--mono); color: var(--ink-2); }
.ev .d { font-family: var(--mono); color: var(--muted); text-align: right; }
.ev .d.big { color: var(--serious); font-weight: 600; }
/* The pill holds the entry type and nothing else, so it always fits its column. */
.ev .ty { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; padding: 0 5px; border-radius: 4px; border: 1px solid var(--border); text-align: center; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.ev .tag { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; padding: 0 4px; margin-left: 4px; border-radius: 4px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
.ev .tag.last { border-color: var(--critical); color: var(--critical); }
.ev .tag.probe { border-color: var(--serious); color: var(--serious); }
.ev.type-error .ty { background: var(--critical); color: #fff; border-color: var(--critical); }
.ev.type-error { background: rgba(208,59,59,.08); }
.ev.type-error.benign, .ev.type-error.soft { background: transparent; }
.ev.type-error.benign .ty { background: transparent; color: var(--muted); border-color: var(--border); }
.ev.type-error.soft .ty { background: var(--serious); border-color: var(--serious); }
.ev.type-warning .ty { background: var(--serious); color: #fff; border-color: var(--serious); }
.ev.type-sys .ty { color: var(--muted); }
.ev.evidence { background: rgba(208,59,59,.06); }
.ev .n { font-weight: 600; }
.ev .s { color: var(--ink-2); }
.ev .payload { display: none; margin: 4px 0 2px 0; }
.ev.open .payload { display: block; }
.ev pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 11px; background: var(--surface-2); border: 1px solid var(--hair); border-radius: 6px; padding: 6px 8px; max-height: 420px; overflow: auto; }
.ev .ptools { display: flex; gap: 6px; margin-bottom: 4px; font-size: 11px; color: var(--muted); flex-wrap: wrap; }
.ev .ptools button { padding: 1px 7px; font-size: 11px; }
.ev .hint { font-size: 12px; color: var(--ink-2); margin: 2px 0 4px; }
.ev.hl { outline: 2px solid var(--accent); }
.more { margin: 8px 0; }
.warnbox { border: 1px solid var(--serious); border-radius: 6px; padding: 6px 8px; margin: 6px 0; font-size: 12px; background: rgba(236,131,90,.08); }
.empty { color: var(--muted); font-style: italic; }
.nomatch { border: 1px dashed var(--border); border-radius: 6px; padding: 6px 8px; font-size: 12px; color: var(--ink-2); }
details.props summary { cursor: pointer; color: var(--accent); font-size: 12px; }
details.props pre { font-size: 11px; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--surface-2); border-radius: 6px; padding: 6px; max-height: 300px; overflow: auto; }

#tlWrap { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
#tlHead { display: flex; flex-shrink: 0; gap: 10px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--hair); font-size: 12px; color: var(--ink-2); }
#tlHead b { color: var(--ink); }
#tlHead .spacer { flex: 1; }
#tlAxis { display: block; flex-shrink: 0; border-bottom: 1px solid var(--hair); }
#tlScroll { overflow: auto; flex: 1; min-height: 0; }
#tlWrap.collapsed #tlScroll, #tlWrap.collapsed #tlAxis { display: none; }
#tlWrap.collapsed { min-height: min-content; }
#tl, #tlAxis { display: block; font-family: var(--sans); }
#tl .lbl { font-size: 11px; fill: var(--ink-2); cursor: pointer; }
#tl .lbl.sp { font-weight: 600; fill: var(--ink); }
#tl .tick, #tlAxis .tick { stroke: var(--hair); stroke-width: 1; }
#tlAxis .axis { font-size: 10px; fill: var(--muted); font-variant-numeric: tabular-nums; }
#tl .bar { cursor: pointer; }
#tl .bar.sel { stroke: var(--ink); stroke-width: 2; }
#tl .band { fill: var(--surface-2); }
#tl .errtick { stroke: var(--critical); stroke-width: 2; }
#tl .softtick { stroke: var(--serious); stroke-width: 2; }
#tl .evtick { stroke: var(--critical); stroke-width: 2; stroke-dasharray: 2 2; }
#tl .spline { stroke: var(--hair); }

#legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 11px; color: var(--ink-2); align-items: center; padding: 0 2px 2px; }
#legend .grp { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
#legend .grp b { color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; font-size: 10px; }
#legend .item { display: inline-flex; align-items: center; gap: 4px; }
#legend .mini { display: inline-block; width: 16px; height: 11px; border: 1px solid #111111; border-radius: 4px 0 4px 0; background: linear-gradient(#525252 0 4px, #9a9a9a 4px 5px, #333333 5px); }
#legend .mini.sel { border-color: var(--node-edge); box-shadow: 0 0 4px var(--node-edge); }
#legend .porticon { display: block; flex-shrink: 0; }
#legend .outtab { display: inline-block; width: 3px; height: 10px; background: #2080ff; clip-path: polygon(0 0, 100% 25%, 100% 75%, 0 100%); }
#legend .pill { display: inline-block; min-width: 15px; padding: 0 4px; border-radius: 7px; color: #fff; font-size: 10px; font-weight: 600; line-height: 14px; text-align: center; }
.lineswatch { display: inline-block; width: 18px; border-top: 3px solid; }
#jsError { display: none; color: #fff; background: var(--critical); padding: 8px 12px; border-radius: 6px; white-space: pre-wrap; }

.tile.nav { cursor: pointer; }
.tile.nav:hover, .tile.nav:focus-visible { border-color: var(--accent); outline: none; }
.tile.nav .l::after { content: ' \203A'; color: var(--accent); }
.anom { border: 1px solid var(--border); border-left: 3px solid var(--serious); border-radius: 6px; padding: 5px 8px; margin: 4px 0; background: var(--surface-2); font-size: 12px; }
.anom.info { border-left-color: var(--hair); }
.anom[data-sel-run] { cursor: pointer; }
.anom[data-sel-run]:hover { border-color: var(--accent); }
.anom .m { color: var(--ink-2); }
.tbar { display: flex; height: 14px; border-radius: 4px; overflow: hidden; border: 1px solid var(--border); margin: 6px 0 4px; }
.tbar span { display: block; height: 100%; min-width: 1px; }
.tbar .idle { background: repeating-linear-gradient(135deg, var(--surface-2) 0 4px, var(--hair) 4px 8px); }
.tlist { margin: 0; padding: 0; list-style: none; font-size: 12px; }
.tlist li { display: grid; grid-template-columns: minmax(0,1fr) 68px; gap: 8px; align-items: center; padding: 2px 0; cursor: pointer; }
.tlist li:hover .lab { color: var(--accent); }
.tlist .bar { height: 6px; background: var(--accent); border-radius: 3px; margin-top: 2px; }
.tlist .n { font-family: var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.ev .ctx { font-size: 10px; color: var(--muted); border: 1px solid var(--hair); border-radius: 4px; padding: 0 4px; margin-left: 4px; white-space: nowrap; }
.ev.slow .d { color: var(--serious); font-weight: 600; }
.ev pre .hl-line { background: rgba(208,59,59,.14); display: inline-block; width: 100%; }
.ev pre mark { background: rgba(250,178,25,.55); color: inherit; padding: 0 1px; }
.ev.cur { box-shadow: inset 3px 0 0 var(--accent); }
#evcount { color: var(--muted); font-size: 11px; white-space: nowrap; flex-basis: 100%; }
#tl .gapfill { fill: url(#gapHatch); pointer-events: none; }
#tl .winfill { fill: var(--accent-soft); }
.kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--surface); }
.h2tools { margin-left: auto; display: flex; gap: 6px; }
.h2tools button { font-size: 11px; padding: 2px 7px; }

/* node boxes (SVG), drawn like the FFAStransX workflow manager (Canvas/Node.tsx); sizes are in its node pixels */
.node { cursor: pointer; }
.node.idle { opacity: .38; }
.node.idle.hidden { display: none; }
.node .frame { fill: #2d2d30; stroke: #111111; stroke-width: 1; }
.node .titlebar { fill: #525252; }
.node .nbody { fill: #333333; }
.node .title { fill: #e0e0e0; font-family: var(--sans); font-size: 10px; }
.node .title.strong { font-weight: 700; }
.node .desc { fill: #cccccc; font-family: var(--sans); font-size: 9px; }
.node .desc.typeonly { fill: #9a9a9a; font-style: italic; }
.node.bypass .title { fill: #a8a8a8; }
.node.bypass .desc { fill: #a6a6a6; }
.node .veil { fill: rgba(12,12,16,0.42); }
.node.bypass .port { opacity: .55; }
/* box-shadow 2px 2px 5px rgba(0,0,0,.5) without a blur filter, which every pan and zoom would repaint per node */
.node .shadow { fill: #000000; fill-opacity: .26; stroke: #000000; stroke-opacity: .12; stroke-width: 6; pointer-events: none; }
/* Selected, or under the pointer here or in the panel and timeline: a white edge with a glow in place of the drop
   shadow. It marks nothing else: the run result is carried by the badge. */
.node .ring { fill: none; stroke: var(--node-edge); stroke-width: 2; vector-effect: non-scaling-stroke; display: none; }
.node .glow { fill: var(--node-edge); opacity: .4; pointer-events: none; display: none; }
.node.sel .ring, .node.sel .glow, .node.hover .ring, .node.hover .glow, .node:hover .ring, .node:hover .glow { display: block; }
.node.sel .shadow, .node.hover .shadow, .node:hover .shadow { display: none; }
.node .badge text { fill: #fff; font-family: var(--sans); font-size: 10px; font-weight: 600; }
.edge { fill: none; }
/* A traversed edge is a thin line with a wider, faint copy under it for the glow. Both use
   non-scaling-stroke, so the glow keeps the same weight at every zoom level. Order matters:
   the halo rules must follow the ones they override at equal specificity. */
.edge.trav { stroke: var(--accent); vector-effect: non-scaling-stroke; stroke-width: 2; stroke-linecap: round; }
.edge.trav.dim { opacity: .28; }
.edge.trav.selsplit { stroke-width: 3; opacity: 1; }
.edge.trav.halo { stroke-width: 7; opacity: .16; }
.edge.trav.halo.selsplit { stroke-width: 11; opacity: .26; }
.grid line { stroke: rgba(128,128,128,.14); stroke-width: 1; vector-effect: non-scaling-stroke; }

@media (max-width: 980px) {
  #app { height: auto; }
  #hdr { flex-wrap: wrap; }
  #stats { flex-basis: 100%; }
  #workspace { height: calc(100vh + 220px); min-height: 680px; }
  #main { grid-template-columns: minmax(0,1fr); grid-template-rows: minmax(0,1fr) 10px var(--panel-height, 320px); }
  #panelSplitter { cursor: row-resize; }
  #panelSplitter::after { width: 32px; height: 3px; left: calc(50% - 16px); top: calc(50% - 1.5px); }
}
</style>
</head>
<body>
<div id="jsError"></div>
<div id="app">
